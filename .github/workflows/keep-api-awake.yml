# Render's free plan puts the API to sleep after 15 idle minutes; while it wakes up,
# requests fail with 429 (x-render-routing: hibernate-rate-limited). Ping it so it stays awake.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health endpoint
        run: curl -fsS --max-time 120 --retry 3 --retry-delay 15 --retry-all-errors https://florinaa-api.onrender.com/api/health
